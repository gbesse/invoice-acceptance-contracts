<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Invoice Acceptance Contracts</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/">INVOICE / ACCEPTANCE CONTRACTS</a>
      <nav aria-label="Language">
        <a href="?lang=fr">FR</a><a href="?lang=en">EN</a><a href="?lang=es">ES</a>
      </nav>
    </header>
    <main>
      <section class="intro">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="title"></h1>
        <p class="lede" data-i18n="lede"></p>
      </section>
      <section class="workspace">
        <aside>
          <span class="number">01 /</span>
          <h2 data-i18n="context"></h2>
          <label class="field" for="receipt" data-i18n="receipt"></label
          ><input type="number" id="receipt" min="0" max="10" step="1" value="3" /><label
            class="field"
            for="prior"
            data-i18n="prior"
          ></label
          ><input type="number" id="prior" min="0" max="10" step="1" value="2" /><label
            class="toggle"
            ><input type="checkbox" id="missing" /><span data-i18n="missing"></span></label
          ><label class="field" for="basis" data-i18n="basis"></label
          ><select id="basis">
            <option value="received"></option>
            <option value="ordered"></option></select
          ><button id="audit" data-i18n="audit"></button>
          <p role="status" id="status"></p>
          <p class="hint" data-i18n="local"></p>
        </aside>
        <article>
          <div class="section-head">
            <div>
              <span class="number">02 /</span>
              <h2 data-i18n="findings"></h2>
            </div>
            <span class="badge" id="verdict">—</span>
          </div>
          <div class="metrics">
            <div><strong id="available">—</strong><span data-i18n="available"></span></div>
            <div><strong>4</strong><span data-i18n="billed"></span></div>
            <div><strong>50.80</strong><span data-i18n="net"></span></div>
          </div>
          <div id="findings"></div>
          <h3 data-i18n="draft"></h3>
          <button id="prepare" data-i18n="prepare"></button>
          <div id="proposal"></div>
          <div class="actions">
            <button class="secondary" id="download" data-i18n="download"></button
            ><code id="digest"></code>
          </div>
        </article>
      </section>
      <footer>
        <p data-i18n="limits"></p>
        <a href="https://github.com/gbesse/invoice-acceptance-contracts">GitHub ↗</a>
      </footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
